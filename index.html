<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EuclidStudio - Interactive Geometry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 260px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
    h1 { font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
    .tool-btn { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; transition: all 0.2s; }
    .tool-btn:hover { background: #3a3a3a; }
    .tool-btn.active { background: #2563eb; border-color: #3b82f6; }
    #canvas-container { flex: 1; position: relative; background: #181818; }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .info { font-size: 0.8rem; color: #888; margin-top: auto; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>EuclidStudio</h1>
    <button class="tool-btn active" onclick="setTool('point')">📍 Point</button>
    <button class="tool-btn" onclick="setTool('line')">📏 Line</button>
    <button class="tool-btn" onclick="setTool('circle')">⭕ Circle</button>
    <button class="tool-btn" onclick="clearCanvas()" style="margin-top: 12px; background: #991b1b;">🗑️ Clear All</button>
    <div class="info">Click canvas to place points or construct shapes.</div>
  </div>
  <div id="canvas-container">
    <canvas id="geometryCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('geometryCanvas');
    const ctx = canvas.getContext('2d');
    let currentTool = 'point';
    let points = [];
    let selectedPoints = [];

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    function setTool(tool) {
      currentTool = tool;
      selectedPoints = [];
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function clearCanvas() {
      points = [];
      selectedPoints = [];
      draw();
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentTool === 'point') {
        points.push({ type: 'point', x, y });
      } else if (currentTool === 'line' || currentTool === 'circle') {
        selectedPoints.push({ x, y });
        if (selectedPoints.length === 2) {
          points.push({
            type: currentTool,
            p1: selectedPoints[0],
            p2: selectedPoints[1]
          });
          selectedPoints = [];
        }
      }
      draw();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for(let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for(let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

      // Draw objects
      points.forEach(item => {
        ctx.fillStyle = '#60a5fa';
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2;

        if (item.type === 'point') {
          ctx.beginPath();
          ctx.arc(item.x, item.y, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'line') {
          ctx.beginPath();
          ctx.moveTo(item.p1.x, item.p1.y);
          ctx.lineTo(item.p2.x, item.p2.y);
          ctx.stroke();
        } else if (item.type === 'circle') {
          const r = Math.hypot(item.p2.x - item.p1.x, item.p2.y - item.p1.y);
          ctx.beginPath();
          ctx.arc(item.p1.x, item.p1.y, r, 0, Math.PI * 2);
          ctx.stroke();
        }
      });
    }

    resize();
  </script>
</body>
</html>
